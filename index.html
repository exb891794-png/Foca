<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOCA — Focaccia artesanal</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&family=Parisienne&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#ffffff;
font-family:Montserrat,sans-serif;
text-align:center;
color:#111;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

/* LOGO */

.logo{
width:80%;
max-width:260px;
margin:10px auto 20px;
display:block;
}

/* TITULO ARCO */

.titulo{
font-family:Anton;
font-size:34px;
letter-spacing:2px;
line-height:1.1;
margin:10px 0 20px;
}

/* LINEA DECORATIVA */

.divider{
margin:20px auto;
width:80%;
border-top:2px solid #111;
opacity:.15;
}

/* ALIAS BOX */

.alias-box{
border:3px solid #111;
border-radius:14px;
padding:18px;
font-size:20px;
font-weight:700;
cursor:pointer;
transition:.25s;
background:#fff;
}

.alias-box small{
font-weight:400;
font-size:14px;
opacity:.7;
}

.alias-box:active{
transform:scale(.97);
}

.copiado{
background:#111;
color:#fff;
}

/* CBU */

.cbu{
margin:15px 0;
font-size:17px;
}

/* CARD MP */

.card{
background:#f4efe8;
padding:18px;
border-radius:14px;
margin:20px 0;
font-weight:600;
}

/* GRACIAS */

.gracias{
font-family:Parisienne;
font-size:30px;
margin:20px 0;
}

/* BOTON WHATSAPP */

.wsp{
display:block;
text-decoration:none;
background:#fff;
border:3px solid #111;
border-radius:14px;
padding:18px;
font-weight:800;
font-size:20px;
color:#111;
margin:25px 0;
transition:.25s;
}

.wsp:hover{
background:#111;
color:#fff;
}

/* FOOTER */

.footer{
margin-top:10px;
font-size:14px;
opacity:.7;
}

</style>

</head>

<body>

<div class="container">

<img src="logo-foca.png" class="logo">

<div class="titulo">
COPIÁ EL ALIAS<br>
Y TRANSFERÍ
</div>

<div class="divider"></div>

<div id="alias" class="alias-box">
Alias: Wally.So.Pago<br>
<small>Tocá para copiar y pagar</small>
</div>

<div class="cbu">
CBU: 0000003100019237015422
</div>

<div class="card">
Mercado Pago<br>
Walter Alberto Sotelo
</div>

<div class="gracias">Gracias</div>

<a class="wsp"
href="https://wa.me/5493858400061?text=Hola%20quiero%20pedir%20una%20focaccia"
target="_blank">
PEDÍ POR WHATSAPP
</a>

<div class="footer">
FOCA — Focaccia artesanal
</div>

</div>

<script>

/* COPIAR + ABRIR MERCADO PAGO */

const aliasBox=document.getElementById("alias");

aliasBox.addEventListener("click",()=>{

const alias="Wally.So.Pago";

/* copiar */
navigator.clipboard.writeText(alias);

/* feedback */
aliasBox.innerHTML="✅ Alias copiado<br><small>Abriendo Mercado Pago...</small>";
aliasBox.classList.add("copiado");

/* abrir app */
window.location.href="mercadopago://";

/* fallback web */
setTimeout(()=>{
window.open("https://www.mercadopago.com.ar/","_blank");
},1200);

/* restaurar */
setTimeout(()=>{
aliasBox.innerHTML="Alias: Wally.So.Pago<br><small>Tocá para copiar y pagar</small>";
aliasBox.classList.remove("copiado");
},3000);

});

</script>

</body>
</html>
