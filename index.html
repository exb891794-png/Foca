<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FOCA — Pago</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&family=Parisienne&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#ffffff;
font-family:Montserrat, sans-serif;
text-align:center;
color:#111;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.logo{
width:65%;
max-width:230px;
margin:10px auto 20px;
display:block;
}

/* titulo tipo FOCA */
.titulo{
font-family:Anton;
font-size:34px;
letter-spacing:2px;
margin-bottom:20px;
transform:rotate(-2deg);
}

/* alias clickeable */
.alias{
border:3px solid #111;
border-radius:14px;
padding:20px;
font-size:22px;
font-weight:800;
cursor:pointer;
background:white;
transition:.2s;
}

.alias:active{
transform:scale(.97);
}

.cbu{
margin:15px 0;
font-size:16px;
}

.card{
background:#f4efe8;
padding:18px;
border-radius:14px;
margin:20px 0;
font-weight:600;
}

/* boton wsp */
.wsp{
display:block;
text-decoration:none;
background:white;
border:3px solid #111;
border-radius:14px;
padding:18px;
font-weight:700;
font-size:20px;
color:#111;
margin-top:25px;
}

.gracias{
font-family:Parisienne;
font-size:30px;
margin-top:25px;
}

.footer{
margin-top:10px;
font-size:14px;
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<img src="logo-foca.png" class="logo">

<div class="titulo">
COPIÁ EL ALIAS<br>Y TRANSFERÍ
</div>

<div id="alias" class="alias">
Wally.So.Pago<br>
<small>Tocá para copiar</small>
</div>

<div class="cbu">
CBU: 0000003100019237015422
</div>

<div class="card">
Mercado Pago<br>
Walter Alberto Sotelo
</div>

<a class="wsp"
href="https://wa.me/5493858400061?text=Hola%20👋%20quiero%20pedir%20una%20focaccia"
target="_blank">
👋 Pedí por WhatsApp
</a>

<div class="gracias">Gracias</div>

<div class="footer">
FOCA — Focaccia artesanal
</div>

</div>

<script>

/* copiar alias */
document.getElementById("alias").onclick=()=>{
navigator.clipboard.writeText("Wally.So.Pago");

const aviso=document.createElement("div");
aviso.innerText="Alias copiado ✔️";
aviso.style.position="fixed";
aviso.style.bottom="25px";
aviso.style.left="50%";
aviso.style.transform="translateX(-50%)";
aviso.style.background="#111";
aviso.style.color="white";
aviso.style.padding="12px 18px";
aviso.style.borderRadius="10px";
aviso.style.fontFamily="Montserrat";
document.body.appendChild(aviso);

setTimeout(()=>aviso.remove(),1800);
};

</script>

</body>
</html>
