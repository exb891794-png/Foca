<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FOCA — Pago</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&family=Parisienne&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#ffffff;
font-family:Montserrat,sans-serif;
text-align:center;
color:#111;
}

.container{
max-width:420px;
margin:auto;
padding:22px;
}

/* LOGO */
.logo{
width:60%;
max-width:220px;
margin:auto;
display:block;
}

/* TITULO */
.titulo{
font-family:Anton;
font-size:34px;
letter-spacing:2px;
margin:20px 0;
}

/* ALIAS */
.alias{
border:3px solid #111;
border-radius:14px;
padding:22px;
font-size:22px;
font-weight:800;
cursor:pointer;
background:white;
transition:.25s;
user-select:none;
}

.alias small{
font-weight:600;
opacity:.6;
}

.alias.copiado{
background:#111;
color:white;
transform:scale(.96);
}

/* CBU */
.cbu{
margin:15px 0;
font-size:16px;
}

/* TARJETA */
.card{
background:#f4efe8;
padding:18px;
border-radius:14px;
margin:20px 0;
font-weight:600;
}

/* BOTON WSP */
.wsp{
display:block;
text-decoration:none;
background:white;
border:3px solid #111;
border-radius:14px;
padding:18px;
font-weight:700;
font-size:20px;
color:#111;
margin-top:25px;
transition:.25s;
}

.wsp.activo{
background:#25D366;
border-color:#25D366;
color:white;
transform:scale(.96);
}

/* GRACIAS */
.gracias{
font-family:Parisienne;
font-size:30px;
margin-top:22px;
}

/* FOOTER */
.footer{
margin-top:10px;
font-size:14px;
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<img src="logo-foca.png" class="logo">

<div class="titulo">
COPIÁ EL ALIAS<br>Y TRANSFERÍ
</div>

<div id="alias" class="alias">
📋 Wally.So.Pago<br>
<small>Tocá para copiar</small>
</div>

<div class="cbu">
CBU: 0000003100019237015422
</div>

<div class="card">
Mercado Pago<br>
Walter Alberto Sotelo
</div>

<a id="wsp" class="wsp"
href="https://wa.me/5493858400061?text=Hola%20👋%20quiero%20pedir%20una%20focaccia">
👋 Pedí por WhatsApp
</a>

<div class="gracias">Gracias</div>

<div class="footer">
FOCA — Focaccia artesanal
</div>

</div>

<script>

/* COPIAR ALIAS PRO */
const alias=document.getElementById("alias");

alias.onclick=()=>{

navigator.clipboard.writeText("Wally.So.Pago");

/* vibración si el celular lo permite */
if(navigator.vibrate){
navigator.vibrate(40);
}

alias.classList.add("copiado");
alias.innerHTML="✔ ALIAS COPIADO";

setTimeout(()=>{
alias.classList.remove("copiado");
alias.innerHTML="📋 Wally.So.Pago<br><small>Tocá para copiar</small>";
},1800);

};


/* BOTON WHATSAPP CON FEEDBACK */
const wsp=document.getElementById("wsp");

wsp.addEventListener("click",(e)=>{

e.preventDefault();

wsp.classList.add("activo");

setTimeout(()=>{
window.location.href=wsp.href;
},350);

});

</script>

</body>
</html>
